<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр текста</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1e1e1e;
            font-family: sans-serif;
            overflow: hidden; /* Убираем скролл у страницы */
        }

        /* Редактор на весь экран */
        textarea {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            resize: none;
            outline: none;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.5;
            box-sizing: border-box;
            display: block;
        }

        /* Панель кнопок */
        .toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            background-color: rgba(40, 40, 40, 0.9);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-clear {
            background-color: #3e3e42;
            color: #ffffff;
        }

        .btn-copy {
            background-color: #007acc;
            color: #ffffff;
        }

        /* Состояние "Скопировано" */
        .btn-copy.copied {
            background-color: #4ec9b0;
            color: #1e1e1e;
        }
    </style>
</head>
<body>

    <!-- Панель управления -->
    <div class="toolbar">
        <button class="btn-clear" id="clearBtn">Очистить</button>
        <button class="btn-copy" id="copyBtn">Копировать</button>
    </div>

    <!-- Область редактирования -->
    <!-- Если вы используете серверную часть, подставьте текст сюда через атрибут value или JS -->
    <textarea id="editor" placeholder="Ожидание текста..."></textarea>

    <script>
        const editor = document.getElementById('editor');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const originalCopyText = copyBtn.innerText;

        // Логика копирования
        copyBtn.addEventListener('click', async () => {
            // Выделяем весь текст визуально
            editor.select();
            editor.setSelectionRange(0, 999999); // Для мобильных устройств

            try {
                // Пишем в буфер обмена
                await navigator.clipboard.writeText(editor.value);
                
                // Меняем текст кнопки
                copyBtn.innerText = "Скопировано!";
                copyBtn.classList.add('copied');

                // Возвращаем обратно через 2 секунды
                setTimeout(() => {
                    copyBtn.innerText = originalCopyText;
                    copyBtn.classList.remove('copied');
                }, 2000);

                // Снимаем выделение (опционально)
                // editor.setSelectionRange(0, 0); 
            } catch (err) {
                console.error('Ошибка копирования: ', err);
                copyBtn.innerText = "Ошибка";
            }
        });

        // Логика очистки
        clearBtn.addEventListener('click', () => {
            editor.value = '';
            editor.focus();
        });

        /*
           ПРИМЕЧАНИЕ ДЛЯ РАЗРАБОТЧИКА:
           
           Если вы подключаете это к бэкенду (Python/Node.js/PHP), 
           вставьте полученный текст в значение textarea.
           
           Например, если используете шаблонизатор:
           <textarea id="editor">{{ received_text }}</textarea>
           
           Или через JavaScript (если получаете данные fetch/axios):
           document.getElementById('editor').value = "Ваш текст от curl";
        */
    </script>
</body>
</html>
